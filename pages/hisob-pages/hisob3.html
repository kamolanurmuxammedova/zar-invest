<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisob ochish — 3/4 — ZAR INVEST</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style type="text/css">
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="bg-[#0b0d10] text-white min-h-screen">

    <div class="flex flex-col justify-between min-h-screen">
        
        <!-- Header -->
        <header class="h-[60px] px-4 sm:px-6 md:px-10 flex justify-between items-center border-b border-[#1f242d]">
            <div class="font-cinzel text-base sm:text-lg font-bold tracking-[1.5px] text-[#dfb954]">
                ZAR INVEST
            </div>
            
            <div class="text-xs tracking-widest text-[#8b93a0]">
                QADAM <span class="text-white font-bold ml-1">3 / 4</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex flex-col lg:flex-row flex-1">
            
            <!-- Left Panel -->
            <section class="flex-1 flex justify-center items-center p-5 sm:p-8 md:p-10 border-b lg:border-b-0 lg:border-r border-[#1f242d]">
                <div class="max-w-[440px] w-full py-2 sm:py-4">
                    
                    <h1 class="font-cinzel text-2xl sm:text-3xl md:text-4xl font-normal leading-tight mb-6 sm:mb-8 text-white">
                        Investor profili
                    </h1>

                    <form id="investor-profile-form" action="hisob4.html" class="flex flex-col gap-5 sm:gap-6">
                        
                        <!-- 1. Maqsad -->
                        <div>
                            <label class="block text-[10px] tracking-[1.5px] text-[#8b93a0] font-semibold uppercase mb-3">
                                SARMOYA KIRITISHDAN ASOSIY MAQSAD
                            </label>
                            <div class="flex flex-col gap-2.5">
                                <label class="goal-option border border-[#dfb954] bg-[#14171f] rounded p-3.5 cursor-pointer block transition-colors">
                                    <input type="radio" name="goal" value="Kapitalni saqlash" checked class="hidden">
                                    <div class="font-semibold text-sm text-white">Kapitalni saqlash va himoya qilish</div>
                                    <div class="text-xs text-[#8b93a0] mt-0.5">Kam xatarli, barqaror daromad</div>
                                </label>

                                <label class="goal-option border border-[#1f242d] bg-[#12141a] hover:border-[#383f4d] rounded p-3.5 cursor-pointer block transition-colors">
                                    <input type="radio" name="goal" value="Portfelni kengaytirish" class="hidden">
                                    <div class="font-semibold text-sm text-white">Portfelni kengaytirish</div>
                                    <div class="text-xs text-[#8b93a0] mt-0.5">O'rtacha o'sish va diversifikatsiya</div>
                                </label>
                            </div>
                        </div>

                        <!-- 2. Muddat -->
                        <div>
                            <label class="block text-[10px] tracking-[1.5px] text-[#8b93a0] font-semibold uppercase mb-3">
                                INVESTITSIYA MUDDATI (GORIZONT)
                            </label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="term-option border border-[#1f242d] bg-[#12141a] hover:border-[#383f4d] rounded p-3.5 cursor-pointer text-center block transition-colors">
                                    <input type="radio" name="term" value="1-2" class="hidden">
                                    <div class="font-semibold text-sm text-white">Qisqa muddat</div>
                                    <div class="text-[11px] text-[#8b93a0] mt-0.5">1-2 YIL</div>
                                </label>
                                <label class="term-option border border-[#dfb954] bg-[#14171f] rounded p-3.5 cursor-pointer text-center block transition-colors">
                                    <input type="radio" name="term" value="3+" checked class="hidden">
                                    <div class="font-semibold text-sm text-white">Uzoq muddat</div>
                                    <div class="text-[11px] text-[#8b93a0] mt-0.5">3+ YIL</div>
                                </label>
                            </div>
                        </div>

                        <!-- 3. Tajriba -->
                        <div>
                            <label class="block text-[10px] tracking-[1.5px] text-[#8b93a0] font-semibold uppercase mb-3">
                                SARMOYAVIY TAJRIBANGIZ
                            </label>
                            <div class="relative">
                                <select name="experience" class="w-full h-11 bg-[#12141a] border border-[#1f242d] focus:border-[#dfb954] rounded px-4 text-sm text-white appearance-none outline-none cursor-pointer">
                                    <option value="1">1 yilgacha (Boshlovchi)</option>
                                    <option value="2">1-3 yil (O'rta)</option>
                                    <option value="3" selected>3 yildan ortiq (Professional)</option>
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#8b93a0] text-xs">▼</div>
                            </div>
                        </div>

                        <!-- 4. Risk -->
                        <div>
                            <label class="block text-[10px] tracking-[1.5px] text-[#8b93a0] font-semibold uppercase mb-3">
                                RISKKA BO'LGAN MUNOSABATINGIZ
                            </label>
                            <div class="flex flex-col gap-2.5">
                                <label class="risk-option border border-[#1f242d] bg-[#12141a] rounded p-3 cursor-pointer flex items-center gap-3 transition-colors">
                                    <input type="radio" name="risk" value="past" class="accent-[#dfb954] w-4 h-4 cursor-pointer">
                                    <span class="text-xs text-[#8b93a0]">Past (Daromad kam bo'lsa ham kapital xavfsizligi)</span>
                                </label>

                                <label class="risk-option border border-[#dfb954] bg-[#14171f] rounded p-3 cursor-pointer flex items-center gap-3 transition-colors">
                                    <input type="radio" name="risk" value="orta" checked class="accent-[#dfb954] w-4 h-4 cursor-pointer">
                                    <span class="text-xs text-white">O'rta (Barqaror daromad va mo'tadil risk)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-between pt-4 mt-2">
                            <a href="./hisob2.html" class="text-xs font-semibold tracking-wider text-[#8b93a0] hover:text-white uppercase transition-colors">
                                ORQAGA
                            </a>
                            
                            <button 
                                type="submit" 
                                class="h-11 px-6 sm:px-8 bg-[#dfb954] hover:bg-[#cb9f3f] text-[#101216] font-semibold text-xs rounded uppercase tracking-wider flex items-center gap-2 cursor-pointer transition-colors"
                            >
                                DAVOM ETISH <span>&rarr;</span>
                            </button>
                        </div>

                    </form>

                </div>
            </section>

            <!-- Right Panel -->
            <section class="flex-1 flex justify-center items-center p-5 sm:p-8 md:p-10 bg-[#090b0e] relative lg:min-h-full">
                <div class="relative max-w-[420px] w-full pb-8 lg:pb-0">
                    
                    <div class="w-full border border-[#1f242d] rounded-xl p-5 sm:p-6 bg-[#0c0e12] relative overflow-hidden">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <div class="text-[9px] tracking-[1.5px] text-[#8b93a0] font-semibold uppercase">RAQAMLI GUVOHNOMA</div>
                                <div class="font-cinzel text-lg sm:text-xl text-white font-normal mt-1">Ulush Sertifikati</div>
                            </div>
                            <div class="w-8 h-8 rounded border border-[#dfb954]/30 bg-[#dfb954]/10 flex items-center justify-center text-[#dfb954]">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                    <path d="M9 12l2 2 4-4"></path>
                                </svg>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-[#12151c] border border-[#dfb954]/30 rounded p-3">
                                <div class="text-[9px] text-[#8b93a0] tracking-wider uppercase">ULUSH ULESHI</div>
                                <div class="text-sm font-semibold text-[#dfb954] font-mono mt-1">
                                    0.45% <span class="text-[9px] text-[#8b93a0] font-sans font-normal ml-1">Mavjud</span>
                                </div>
                            </div>

                            <div class="bg-[#12151c] border border-[#1f242d] rounded p-3">
                                <div class="text-[9px] text-[#8b93a0] tracking-wider uppercase">SUMMA</div>
                                <div class="text-sm font-semibold text-white font-mono mt-1">
                                    50,000,000 <span class="text-[9px] text-[#8b93a0] font-sans font-normal">UZS</span>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="text-[9px] text-[#8b93a0] uppercase tracking-wider">EGASI</div>
                            <div class="text-xs text-white font-mono tracking-wider mt-0.5">ID: 8829-X-2024</div>
                        </div>
                    </div>

                    <div class="static lg:absolute lg:-bottom-6 lg:-right-2 w-full lg:max-w-[220px] bg-[#141720] border border-[#1f242d] rounded-lg p-3.5 shadow-2xl mt-4 lg:mt-0">
                        <div class="flex items-center gap-1.5 text-[10px] font-semibold text-[#dfb954] tracking-wider uppercase mb-1">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
                            </svg>
                            DINAMIK PROFIL
                        </div>
                        <p class="text-[11px] text-[#8b93a0] leading-snug">
                            Sizning tanlovingiz sertifikat qiymati va daromadlilik darajasiga ta'sir qilmoqda.
                        </p>
                    </div>

                </div>
            </section>
        </main>

    </div>

    <script src="../../js/main.js"></script>
</body>
</html>
